site_name: GoodLiveWidget ドキュメント
site_description: ライブ配信向けオーバーレイ管理ソフト「GoodLiveWidget」の公式ドキュメント
site_url: https://zainnstar.github.io/GoodLiveWidget_Document/
copyright: Copyright &copy; 2026 稲峰幸助 Inamine Kosuke - GoodLuckLab

theme:
  name: material
  language: ja
  logo: img/GLWidget_Icon.png
  favicon: img/GLWidget_Icon.png
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables

nav:
  - はじめに: index.md
  - インストール: installation.md
  - パネル:
      - パネル一覧: panels/overview.md
      - ウィジェット一覧: panels/widget-list.md
      - インスペクタ: panels/inspector.md
      - 共通デザイン: panels/common-design.md
      - 接続: panels/connection.md
      - トランスフォーム: panels/transform.md
      - プレビュー: panels/preview.md
      - 設定: panels/settings.md
      - 配信連携: panels/streaming-integration.md
      - 視聴者分析: panels/viewer-analytics.md
      - コメント分析: panels/comment-analytics.md
      - コメントテスト: panels/comment-test.md
      - ログ: panels/logs.md
  - ウィジェット:
      - ウィジェット一覧: widgets/overview.md
      - 機能:
          - カウンター: widgets/counter.md
          - セットリスト: widgets/setlist.md
          - セットリスト (縦): widgets/setlist-vertical.md
          - ビンゴ: widgets/bingo.md
          - ルーレット: widgets/roulette.md
          - ルーレット (テキスト): widgets/roulette-text.md
          - サイコロ: widgets/dice.md
          - SEサウンド: widgets/se-sound.md
          - タイマー: widgets/timer.md
          - メモ: widgets/memo.md
          - 配信カウンター: widgets/streaming-counter.md
          - 配信マルチカウンター: widgets/streaming-multi-counter.md
          - 挨拶カウンター: widgets/greeting-counter.md
          - お絵描き: widgets/paint.md
          - ゆるゆるお絵描き: widgets/wiggle-paint.md
          - チェックリスト: widgets/checklist.md
          - トピックボード: widgets/topic-board.md
          - アンケート: widgets/community-poll.md
      - 装飾:
          - コメントオーバーレイ: widgets/comment-overlay.md
          - 共通デザイン: widgets/common-design-widget.md
          - 画像: widgets/image.md
          - スタンプ: widgets/stamp.md
          - テロップ: widgets/telop.md
          - カレンダー（週）: widgets/calendar-week.md
          - カレンダー（月）: widgets/calendar-month.md
          - スケジュール (横): widgets/schedule-horizontal.md
          - スケジュール (縦): widgets/schedule-vertical.md
          - 集中線: widgets/focus-lines.md
          - 画像ループ: widgets/image-loop.md
          - 天気予報 (単一): widgets/weather-japan-single.md
          - 天気予報 (全国): widgets/weather-japan-national.md
          - 配信トリガー: widgets/streaming-trigger.md
          - 初見さんタイマー: widgets/first-comment-extension-timer.md
          - トリガーアクション: widgets/trigger-action.md
          - ビデオプレーヤー: widgets/video-player.md
          - 雨: widgets/rain.md
          - 雪: widgets/snow.md
          - ネオンペンライト: widgets/penlight.md
          - ビームライト: widgets/beam-light.md
          - 壁掛け時計: widgets/wall-clock.md
          - スライドショー: widgets/slideshow.md
          - エンドロール: widgets/end-roll.md
      - 高度な装飾:
          - パーティクル (2D): widgets/particle-2d.md
          - パーティクル (2Dバースト): widgets/particle-2d-burst.md
          - パーティクル (3D): widgets/particle-3d.md
          - 海: widgets/ocean.md
          - 海 (WebGPU): widgets/ocean-webgpu.md
          - HDRローダー: widgets/hdr-loader.md

      - ゲーム:
          - じゃんけん: widgets/janken.md
          - 仲間はずれ探し: widgets/odd-one-out.md
          - 日本地図チェック: widgets/japan-map-check.md
          - 誕生日チェッカー: widgets/birthday-checker.md

  - ライセンス: license.md
  - FAQ: faq.md
